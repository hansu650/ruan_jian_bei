[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eduforge-api"
version = "0.1.0"
description = "EduForge 智学工坊 FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "EduForge Team" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
warn_unused_configs = true
ignore_missing_imports = true
